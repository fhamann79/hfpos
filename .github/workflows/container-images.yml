name: Containers and recovery
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  operations:
    name: Production-like smoke and restore rehearsal
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build three images, smoke TLS/proxy and rehearse recovery
        shell: pwsh
        run: ./scripts/ops/start-deployment-smoke.ps1 -Cleanup
      - name: Always clean synthetic runtime, volumes, certificates and backups
        if: always()
        shell: pwsh
        run: ./scripts/ops/stop-deployment-smoke.ps1
  publish:
    name: Publish versioned images (NO deployment)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: backend/Pos.Backend.Api/Dockerfile
          - image: web
            dockerfile: frontend/pos-frontend/Dockerfile
          - image: migrations
            dockerfile: backend/Pos.Backend.Api/Dockerfile.migrations
    steps:
      - uses: actions/checkout@v4
      - name: Require a human release version tag
        env:
          RELEASE: ${{ github.ref_name }}
        run: '[[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hfpos-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hfpos-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true
