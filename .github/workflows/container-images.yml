name: Containers and recovery
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-preparation-tests:
    name: Release source and optional PG configuration tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test real release verifier in disposable Git repositories
        run: python scripts/ci/test_verify_release_source.py
      - name: Materialize synthetic Compose configuration without starting services
        run: python scripts/ci/test_pilot_compose.py
      - name: Test supervised signed protocol, archive and root-owned synthetic checkpoints
        run: sudo python3 scripts/ci/test_supervised_operations.py
      - name: Test restored application guards without Docker or real data
        run: sudo python3 -B scripts/ci/test_human_application_verification.py -v
  operations:
    name: Production-like smoke and restore rehearsal
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test smoke native commands, cleanup and readiness helpers
        shell: pwsh
        run: ./scripts/ops/test-smoke-support.ps1
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Supervised signed receiver and isolated PostgreSQL/keyring E2E (synthetic only)
        env:
          HFPOS_SUPERVISED_DOCKER_TESTS: 'YES'
          HFPOS_SUPERVISED_NATIVE_AGE: 'YES'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,HFPOS_SUPERVISED_DOCKER_TESTS,HFPOS_SUPERVISED_NATIVE_AGE python3 scripts/ci/test_supervised_operations.py
      - name: Human one-shot PostgreSQL bookworm and keyring E2E (synthetic only)
        env:
          HFPOS_HUMAN_DOCKER_TESTS: 'YES'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,HFPOS_HUMAN_DOCKER_TESTS python3 scripts/ci/test_human_recovery.py -v
      - name: Build three images, smoke TLS/proxy and rehearse recovery
        shell: pwsh
        run: ./scripts/ops/start-deployment-smoke.ps1
      - name: Build framework-only public restored application probe
        run: |
          dotnet publish backend/Pos.Backend.Api/Hfpos.FiscalSmokeHost/RestoredApplicationProbe/RestoredApplicationProbe.csproj -c Release -o "$RUNNER_TEMP/dev531-probe" /p:UseAppHost=false
          git rev-parse HEAD > "$RUNNER_TEMP/dev531-probe/source-sha.txt"
          sha256sum "$RUNNER_TEMP/dev531-probe/RestoredApplicationProbe.dll" > "$RUNNER_TEMP/dev531-probe/probe-sha256.txt"
          python3 -I -B scripts/ops/human-application-verification.py seal --source-sha "$(git rev-parse HEAD)" --probe-dll "$RUNNER_TEMP/dev531-probe/RestoredApplicationProbe.dll" --output "$RUNNER_TEMP/dev531-app-code"
      - name: Actual deployed RC HTTP, restored DB/keyring, read-only queued worker and absent payload E2E
        env:
          HFPOS_APPLICATION_DOCKER_TESTS: 'YES'
          HFPOS_APPLICATION_PROBE_DLL: ${{ runner.temp }}/dev531-probe/RestoredApplicationProbe.dll
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,HFPOS_APPLICATION_DOCKER_TESTS,HFPOS_APPLICATION_PROBE_DLL python3 -B scripts/ci/test_human_application_verification.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: dev531-public-application-probe
          path: |
            ${{ runner.temp }}/dev531-app-code/
            ${{ runner.temp }}/dev531-probe/source-sha.txt
            ${{ runner.temp }}/dev531-probe/probe-sha256.txt
          if-no-files-found: error
      - name: Always clean synthetic runtime, volumes, certificates and backups
        if: always()
        shell: pwsh
        run: ./scripts/ops/stop-deployment-smoke.ps1
  windows-smoke-support:
    name: Windows PowerShell 5 smoke support tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test using Windows PowerShell, without PowerShell 7 or Docker
        shell: powershell
        run: ./scripts/ops/test-smoke-support.ps1
      - name: Test supervised native Windows ACL helper and synthetic signed plans
        run: python scripts/ci/test_supervised_operations.py
      - name: Test human Windows export and literal owned cleanup (native synthetic age fake)
        run: python scripts/ci/test_human_recovery.py -v
  verify-release-source:
    name: Verify release tag belongs to main
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact release version and a commit from main
        shell: bash
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Do not let a helper from an unmerged tag waive ancestry.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release refused: tagged commit is not part of main.' >&2
            exit 1
          fi
          python scripts/ci/verify_release_source.py "$RELEASE" "$GITHUB_SHA"
  publish:
    name: Publish versioned images (NO deployment)
    needs: verify-release-source
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.verify-release-source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: backend/Pos.Backend.Api/Dockerfile
          - image: web
            dockerfile: frontend/pos-frontend/Dockerfile
          - image: migrations
            dockerfile: backend/Pos.Backend.Api/Dockerfile.migrations
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hfpos-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hfpos-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true
