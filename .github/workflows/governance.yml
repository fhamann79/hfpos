name: AI-Native Governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  governance:
    if: >-
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')) &&
      (github.event_name != 'pull_request_review_comment' ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    name: Governance Event Processor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve canonical pull request context from GitHub
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pullNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!pullNumber) {
              core.setFailed('Could not resolve pull request number from event.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pr.base.ref !== 'main') {
              core.setFailed(`Governance only supports PRs targeting main; got ${pr.base.ref}.`);
              return;
            }
            const eventPath = path.join(process.env.RUNNER_TEMP, 'hfpos-pr-event.json');
            fs.writeFileSync(eventPath, JSON.stringify({ pull_request: pr }), { encoding: 'utf8' });
            core.setOutput('number', String(pullNumber));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.clone_url);
            core.setOutput('event_path', eventPath);

      - name: Mark governance pending on PR HEAD
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'AI-Native Governance',
              description: 'Governance/review evidence is being evaluated',
            });

      - name: Persist blocking trusted-review event on reviewed commit
        uses: actions/github-script@v7
        with:
          script: |
            const trusted = 'chatgpt-codex-connector[bot]';
            const action = String(context.payload.action ?? '').toLowerCase();
            let blocking = false;
            let reviewedSha = '';
            let description = 'Blocking trusted review finding on reviewed commit';

            if (context.eventName === 'pull_request_review_comment') {
              const comment = context.payload.comment ?? {};
              const login = comment.user?.login ?? '';
              const body = comment.body ?? '';
              reviewedSha = String(comment.commit_id ?? '').toLowerCase();
              if (login === trusted && action === 'deleted') {
                // Deleting trusted inline review evidence is fail-closed. The
                // immutable reviewed commit must receive a sticky finding ledger.
                blocking = true;
                description = 'Trusted review evidence was deleted from reviewed commit';
              } else if (login === trusted && /\[(BLOCKER|MAJOR)\]/i.test(body)) {
                blocking = true;
              }
            }

            if (context.eventName === 'pull_request_review') {
              const review = context.payload.review ?? {};
              const login = review.user?.login ?? '';
              const state = String(review.state ?? '').toUpperCase();
              reviewedSha = String(review.commit_id ?? '').toLowerCase();
              if (login === trusted && state === 'CHANGES_REQUESTED') {
                blocking = true;
                description = 'Trusted reviewer requested changes on reviewed commit';
              } else if (login === trusted && action === 'dismissed') {
                // A dismissed trusted review cannot erase findings already tied
                // to the immutable commit. Treat dismissal itself as blocking.
                blocking = true;
                description = 'Trusted review was dismissed on reviewed commit';
              }
            }

            if (blocking) {
              if (!/^[0-9a-f]{40}$/.test(reviewedSha)) {
                core.setFailed('Blocking review event does not contain a full reviewed commit SHA.');
                return;
              }
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: reviewedSha,
                state: 'failure',
                context: 'AI-Native Review Finding',
                description,
              });
            }

      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run trusted governance regression tests
        run: python3 scripts/ci/test_validate_pr_governance.py

      - name: Fetch PR head without executing PR code
        env:
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: git fetch --no-tags --depth=1 "$HEAD_REPO" "$HEAD_SHA"

      - name: Collect changed files
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/hfpos-changed-files.txt"
          echo "Changed files:"
          cat "$RUNNER_TEMP/hfpos-changed-files.txt"

      - name: Collect trusted GitHub review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REVIEW_EVIDENCE_FILE: ${{ runner.temp }}/hfpos-review-evidence.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          head_sha = os.environ["HEAD_SHA"].lower()
          output = os.environ["REVIEW_EVIDENCE_FILE"]
          trusted_reviewers = {"chatgpt-codex-connector[bot]"}
          finding_context = "AI-Native Review Finding"
          clean_header = "Codex Review: Didn't find any major issues. Chef's kiss."
          clean_commit_line = re.compile(r"\*\*Reviewed commit:\*\* `([0-9a-f]{10,40})`", re.IGNORECASE)

          def request_json(path, method="GET", payload=None):
              url = f"{api}{path}"
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def get_all(path):
              items = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  batch = request_json(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise RuntimeError(f"Expected list from GitHub API: {path}")
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          def resolve_commit(ref):
              if not re.fullmatch(r"[0-9a-f]{10,40}", ref, re.IGNORECASE):
                  return None
              encoded_ref = urllib.parse.quote(ref, safe="")
              try:
                  commit = request_json(f"/repos/{repo}/commits/{encoded_ref}")
              except urllib.error.HTTPError:
                  return None
              resolved = (commit.get("sha") or "").lower() if isinstance(commit, dict) else ""
              if not re.fullmatch(r"[0-9a-f]{40}", resolved):
                  return None
              return resolved

          def post_finding_status(description):
              request_json(
                  f"/repos/{repo}/statuses/{head_sha}",
                  method="POST",
                  payload={
                      "state": "failure",
                      "context": finding_context,
                      "description": description[:140],
                  },
              )

          reviews = get_all(f"/repos/{repo}/pulls/{pr}/reviews")
          review_comments = get_all(f"/repos/{repo}/pulls/{pr}/comments")
          issue_comments = get_all(f"/repos/{repo}/issues/{pr}/comments")
          statuses = get_all(f"/repos/{repo}/commits/{head_sha}/statuses")

          sticky_findings = any(
              status.get("context") == finding_context and status.get("state") == "failure"
              for status in statuses
          )

          by_review = {}
          for comment in review_comments:
              commenter = ((comment.get("user") or {}).get("login") or "")
              if commenter not in trusted_reviewers:
                  continue
              review_id = comment.get("pull_request_review_id")
              if review_id is None:
                  continue
              body = comment.get("body") or ""
              bucket = by_review.setdefault(review_id, {"blocker_count": 0, "major_count": 0})
              bucket["blocker_count"] += len(re.findall(r"\[BLOCKER\]", body, flags=re.IGNORECASE))
              bucket["major_count"] += len(re.findall(r"\[MAJOR\]", body, flags=re.IGNORECASE))

          attestations = []
          blocking_now = False
          for review in reviews:
              reviewer = ((review.get("user") or {}).get("login") or "")
              if reviewer not in trusted_reviewers:
                  continue
              commit_id = (review.get("commit_id") or "").lower()
              if not re.fullmatch(r"[0-9a-f]{40}", commit_id):
                  continue
              review_id = review.get("id")
              counts = by_review.get(review_id, {"blocker_count": 0, "major_count": 0})
              state = str(review.get("state") or "").upper()
              attestations.append(
                  {
                      "id": review_id,
                      "kind": "review",
                      "reviewer": reviewer,
                      "state": state,
                      "commit_id": commit_id,
                      "created_at": review.get("submitted_at") or "",
                      "blocker_count": counts["blocker_count"],
                      "major_count": counts["major_count"],
                  }
              )
              if commit_id == head_sha and (
                  counts["blocker_count"] > 0
                  or counts["major_count"] > 0
                  or state == "CHANGES_REQUESTED"
              ):
                  blocking_now = True

          for comment in issue_comments:
              reviewer = ((comment.get("user") or {}).get("login") or "")
              if reviewer not in trusted_reviewers:
                  continue
              body = comment.get("body") or ""
              lines = body.splitlines()
              if len(lines) < 3 or lines[0].strip() != clean_header or lines[1].strip() != "":
                  continue
              commit_match = clean_commit_line.fullmatch(lines[2].strip())
              if not commit_match:
                  continue
              if re.search(r"\[(?:BLOCKER|MAJOR)\]", body, flags=re.IGNORECASE):
                  continue
              resolved = resolve_commit(commit_match.group(1).lower())
              if resolved != head_sha:
                  continue
              attestations.append(
                  {
                      "id": comment.get("id"),
                      "kind": "clean_comment",
                      "reviewer": reviewer,
                      "state": "CLEAN",
                      "commit_id": resolved,
                      "created_at": comment.get("created_at") or "",
                      "blocker_count": 0,
                      "major_count": 0,
                  }
              )

          if blocking_now and not sticky_findings:
              post_finding_status("Persistent blocking Codex finding on immutable HEAD")
              sticky_findings = True

          evidence = {
              "head_sha": head_sha,
              "sticky_findings": sticky_findings,
              "attestations": attestations,
          }
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)

          print(f"Trusted Codex attestations found: {len(attestations)}")
          print(f"Persistent finding ledger: {'BLOCKING' if sticky_findings else 'CLEAR'}")
          for item in attestations:
              print(
                  f"  kind={item['kind']} id={item['id']} commit={item['commit_id']} "
                  f"state={item['state']} BLOCKER={item['blocker_count']} MAJOR={item['major_count']}"
              )
          PY

      - name: Validate governance and independent-review readiness
        id: validate
        continue-on-error: true
        env:
          HFPOS_EVENT_PATH: ${{ steps.pr.outputs.event_path }}
          HFPOS_CHANGED_FILES: ${{ runner.temp }}/hfpos-changed-files.txt
          HFPOS_REVIEW_EVIDENCE: ${{ runner.temp }}/hfpos-review-evidence.json
          HFPOS_REQUIRE_REVIEW_READY: "1"
        run: python3 scripts/ci/validate_pr_governance.py

      - name: Publish governance result on PR HEAD
        if: always()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const passed = process.env.VALIDATION_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: passed ? 'success' : 'failure',
              context: 'AI-Native Governance',
              description: passed
                ? 'Governance and independent review are ready'
                : 'Governance/review requirements are not satisfied',
            });

      - name: Fail workflow when governance is not ready
        if: steps.validate.outcome != 'success'
        run: exit 1
