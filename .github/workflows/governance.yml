name: AI-Native Governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: AI-Native Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run trusted governance regression tests
        run: python3 scripts/ci/test_validate_pr_governance.py

      - name: Fetch PR head without executing PR code
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 "$HEAD_REPO" "$HEAD_SHA"

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare the two trees directly. Do not use the triple-dot form here:
          # the PR head is intentionally fetched shallowly and may not carry enough
          # ancestry to compute a merge-base. The protected ruleset requires the PR
          # to be up to date with main, so BASE_SHA..HEAD_SHA is the intended delta.
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/hfpos-changed-files.txt"
          echo "Changed files:"
          cat "$RUNNER_TEMP/hfpos-changed-files.txt"

      - name: Collect trusted GitHub review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_EVIDENCE_FILE: ${{ runner.temp }}/hfpos-review-evidence.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          api = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          head_sha = os.environ["HEAD_SHA"].lower()
          output = os.environ["REVIEW_EVIDENCE_FILE"]
          trusted_reviewers = {"chatgpt-codex-connector[bot]"}

          def get_all(path):
              items = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  url = f"{api}{path}{separator}per_page=100&page={page}"
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      batch = json.load(response)
                  if not isinstance(batch, list):
                      raise RuntimeError(f"Expected list from GitHub API: {path}")
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          reviews = get_all(f"/repos/{repo}/pulls/{pr}/reviews")
          comments = get_all(f"/repos/{repo}/pulls/{pr}/comments")

          by_review = {}
          for comment in comments:
              review_id = comment.get("pull_request_review_id")
              if review_id is None:
                  continue
              body = comment.get("body") or ""
              bucket = by_review.setdefault(review_id, {"blocker_count": 0, "major_count": 0})
              bucket["blocker_count"] += len(re.findall(r"\[BLOCKER\]", body, flags=re.IGNORECASE))
              bucket["major_count"] += len(re.findall(r"\[MAJOR\]", body, flags=re.IGNORECASE))

          normalized = []
          for review in reviews:
              reviewer = ((review.get("user") or {}).get("login") or "")
              if reviewer not in trusted_reviewers:
                  continue
              review_id = review.get("id")
              counts = by_review.get(review_id, {"blocker_count": 0, "major_count": 0})
              normalized.append(
                  {
                      "id": review_id,
                      "reviewer": reviewer,
                      "state": review.get("state"),
                      "commit_id": (review.get("commit_id") or "").lower(),
                      "submitted_at": review.get("submitted_at"),
                      "blocker_count": counts["blocker_count"],
                      "major_count": counts["major_count"],
                  }
              )

          evidence = {"head_sha": head_sha, "reviews": normalized}
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)

          print(f"Trusted Codex reviews found: {len(normalized)}")
          for review in normalized:
              print(
                  f"  id={review['id']} commit={review['commit_id']} state={review['state']} "
                  f"BLOCKER={review['blocker_count']} MAJOR={review['major_count']}"
              )
          PY

      - name: Validate PR governance and independent-review readiness with trusted validator
        env:
          HFPOS_CHANGED_FILES: ${{ runner.temp }}/hfpos-changed-files.txt
          HFPOS_REVIEW_EVIDENCE: ${{ runner.temp }}/hfpos-review-evidence.json
          HFPOS_REQUIRE_REVIEW_READY: "1"
        run: python3 scripts/ci/validate_pr_governance.py
