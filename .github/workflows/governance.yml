name: AI-Native Governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

# IMPORTANT: this trusted workflow runs only default/base-branch code. It never
# checks out or executes code from the PR HEAD. Its built-in GITHUB_TOKEN cannot
# write commit statuses. The required governance status is emitted only with the
# dedicated HFPOS Governance Gate GitHub App token stored in a protected
# environment. That environment MUST be restricted to Selected branches and
# tags -> Branch main only before its App secrets are added.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: governance-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  governance:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    name: Governance Event Processor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hfpos-governance
    steps:
      - name: Resolve canonical pull request context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pullNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!pullNumber) {
              core.setFailed('Could not resolve pull request number from event.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pr.base.ref !== 'main') {
              core.setFailed(`Governance only supports PRs targeting main; got ${pr.base.ref}.`);
              return;
            }

            const eventPath = path.join(process.env.RUNNER_TEMP, 'hfpos-pr-event.json');
            fs.writeFileSync(eventPath, JSON.stringify({ pull_request: pr }), { encoding: 'utf8' });

            const comment = context.payload.comment ?? {};
            const body = String(comment.body ?? '');
            const commenter = String(comment.user?.login ?? '');
            const association = String(comment.author_association ?? '').toUpperCase();
            const trustedAssociation = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);
            const isPrAuthor = commenter !== '' && commenter === String(pr.user?.login ?? '');
            const isCreatedIssueComment = context.eventName === 'issue_comment' && context.payload.action === 'created';
            const isCodexBot = commenter === 'chatgpt-codex-connector[bot]';
            const authorizedRequester = trustedAssociation || isPrAuthor;
            const reviewRequested = isCreatedIssueComment && authorizedRequester && !isCodexBot && /(^|\s)@codex\s+review\b/i.test(body);
            const trustedCodexCommentEvent = context.eventName === 'issue_comment' && isCodexBot;

            core.setOutput('number', String(pullNumber));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo', pr.head.repo.clone_url);
            core.setOutput('event_path', eventPath);
            core.setOutput('review_requested', reviewRequested ? 'true' : 'false');
            core.setOutput('trusted_codex_comment_event', trustedCodexCommentEvent ? 'true' : 'false');

      - name: Mint dedicated governance App token
        id: governance-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HFPOS_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.HFPOS_GOVERNANCE_PRIVATE_KEY }}

      - name: Fail closed while review evidence changes
        if: steps.pr.outputs.review_requested == 'true' || steps.pr.outputs.trusted_codex_comment_event == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.governance-app.outputs.token }}
          script: |
            const headSha = '${{ steps.pr.outputs.head_sha }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: 'pending',
              context: 'AI-Native Governance',
              description: '${{ steps.pr.outputs.review_requested }}' === 'true'
                ? 'Independent Codex review requested for current HEAD'
                : 'Trusted Codex review evidence changed; re-evaluating',
              target_url: runUrl,
            });

      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run trusted governance regression tests
        run: python3 scripts/ci/test_validate_pr_governance.py

      - name: Fetch PR head as Git object only
        env:
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: git fetch --no-tags --depth=1 "$HEAD_REPO" "$HEAD_SHA"

      - name: Collect changed files
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/hfpos-changed-files.txt"
          echo "Changed files:"
          cat "$RUNNER_TEMP/hfpos-changed-files.txt"

      - name: Collect trusted Codex evidence from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REVIEW_EVIDENCE_FILE: ${{ runner.temp }}/hfpos-review-evidence.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          head_sha = os.environ["HEAD_SHA"].lower()
          output = os.environ["REVIEW_EVIDENCE_FILE"]
          trusted_reviewer = "chatgpt-codex-connector[bot]"
          trusted_request_associations = {"OWNER", "MEMBER", "COLLABORATOR"}
          request_pattern = re.compile(r"(^|\s)@codex\s+review\b", re.IGNORECASE)
          clean_headers = {
              "Codex Review: Didn't find any major issues.",
              "Codex Review: Didn't find any major issues. Chef's kiss.",
              "Codex Review: Didn't find any major issues. You're on a roll.",
              "Codex Review: Didn't find any major issues. Hooray!",
          }
          clean_commit_line = re.compile(r"\*\*Reviewed commit:\*\* `([0-9a-f]{10,40})`", re.IGNORECASE)

          def request_json(path):
              request = urllib.request.Request(
                  f"{api}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def get_all(path):
              items = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  batch = request_json(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise RuntimeError(f"Expected list from GitHub API: {path}")
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          def resolve_commit(ref):
              if not re.fullmatch(r"[0-9a-f]{10,40}", ref, re.IGNORECASE):
                  return None
              encoded = urllib.parse.quote(ref, safe="")
              try:
                  commit = request_json(f"/repos/{repo}/commits/{encoded}")
              except urllib.error.HTTPError:
                  return None
              resolved = (commit.get("sha") or "").lower() if isinstance(commit, dict) else ""
              return resolved if re.fullmatch(r"[0-9a-f]{40}", resolved) else None

          pr_data = request_json(f"/repos/{repo}/pulls/{pr}")
          pr_author = ((pr_data.get("user") or {}).get("login") or "") if isinstance(pr_data, dict) else ""
          issue_comments = get_all(f"/repos/{repo}/issues/{pr}/comments")

          # Derive review freshness from authoritative GitHub issue-comment state,
          # not from whether a particular Actions run survived concurrency
          # coalescing. Only trusted collaborators/owners or the PR author can
          # establish a new review-request boundary.
          latest_review_request_at = ""
          latest_review_request_id = None
          for comment in issue_comments:
              commenter = ((comment.get("user") or {}).get("login") or "")
              if commenter == trusted_reviewer:
                  continue
              association = str(comment.get("author_association") or "").upper()
              authorized = association in trusted_request_associations or commenter == pr_author
              body = comment.get("body") or ""
              if not authorized or not request_pattern.search(body):
                  continue
              created_at = comment.get("created_at") or ""
              if created_at > latest_review_request_at:
                  latest_review_request_at = created_at
                  latest_review_request_id = comment.get("id")

          attestations = []

          # Fail closed: observed Codex behavior creates a GitHub review object
          # when it has findings. Any trusted review object on this exact HEAD is
          # therefore blocking, independent of mutable inline comment text/state.
          for review in get_all(f"/repos/{repo}/pulls/{pr}/reviews"):
              reviewer = ((review.get("user") or {}).get("login") or "")
              commit_id = (review.get("commit_id") or "").lower()
              if reviewer != trusted_reviewer or not re.fullmatch(r"[0-9a-f]{40}", commit_id):
                  continue
              attestations.append(
                  {
                      "id": review.get("id"),
                      "kind": "review",
                      "reviewer": reviewer,
                      "state": review.get("state") or "",
                      "commit_id": commit_id,
                      "created_at": review.get("submitted_at") or "",
                  }
              )

          # Clean verdicts are accepted only with exact first-line variants
          # observed from Codex. Unknown qualifiers fail closed. The displayed
          # short SHA must resolve through GitHub to the exact current HEAD, and
          # the verdict must be newer than the latest authorized review request.
          for comment in issue_comments:
              reviewer = ((comment.get("user") or {}).get("login") or "")
              if reviewer != trusted_reviewer:
                  continue
              body = comment.get("body") or ""
              lines = body.splitlines()
              if (
                  len(lines) < 5
                  or lines[0].strip() not in clean_headers
                  or lines[1].strip() != ""
                  or lines[3].strip() != ""
                  or not lines[4].lstrip().startswith("<details>")
              ):
                  continue
              created_at = comment.get("created_at") or ""
              if latest_review_request_at and created_at <= latest_review_request_at:
                  continue
              commit_match = clean_commit_line.fullmatch(lines[2].strip())
              if not commit_match or re.search(r"\[(?:BLOCKER|MAJOR)\]", body, re.IGNORECASE):
                  continue
              resolved = resolve_commit(commit_match.group(1).lower())
              if resolved != head_sha:
                  continue
              attestations.append(
                  {
                      "id": comment.get("id"),
                      "kind": "clean_comment",
                      "reviewer": reviewer,
                      "state": "CLEAN",
                      "commit_id": resolved,
                      "created_at": created_at,
                  }
              )

          with open(output, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "head_sha": head_sha,
                      "latest_review_request_at": latest_review_request_at,
                      "latest_review_request_id": latest_review_request_id,
                      "attestations": attestations,
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )

          print(
              "Latest authorized review request: "
              f"id={latest_review_request_id or 'NONE'} at={latest_review_request_at or 'NONE'}"
          )
          print(f"Trusted Codex attestations found: {len(attestations)}")
          for item in attestations:
              print(f"  kind={item['kind']} id={item['id']} commit={item['commit_id']} state={item['state']}")
          PY

      - name: Validate governance and review readiness
        id: validate
        continue-on-error: true
        env:
          HFPOS_EVENT_PATH: ${{ steps.pr.outputs.event_path }}
          HFPOS_CHANGED_FILES: ${{ runner.temp }}/hfpos-changed-files.txt
          HFPOS_REVIEW_EVIDENCE: ${{ runner.temp }}/hfpos-review-evidence.json
          HFPOS_REQUIRE_REVIEW_READY: "1"
        run: python3 scripts/ci/validate_pr_governance.py

      - name: Publish App-authenticated governance result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.governance-app.outputs.token }}
          script: |
            const headSha = '${{ steps.pr.outputs.head_sha }}';
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('Could not resolve a valid PR HEAD for governance publishing.');
              return;
            }
            const passed = '${{ steps.validate.outcome }}' === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: passed ? 'success' : 'failure',
              context: 'AI-Native Governance',
              description: passed
                ? 'Governance and independent Codex review are ready'
                : 'Governance/review requirements are not satisfied',
              target_url: runUrl,
            });

      - name: Fail workflow when governance is not ready
        if: steps.validate.outcome != 'success'
        run: exit 1
