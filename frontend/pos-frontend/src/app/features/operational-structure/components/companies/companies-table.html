<div class="entity-card">
  <p-toolbar styleClass="entity-card__toolbar">
    <ng-template #start>
      <div>
        <h3>Empresa actual</h3>
      </div>
    </ng-template>
  </p-toolbar>

  @if (errorMessage()) {
    <p-message severity="error" [text]="errorMessage()"></p-message>
  }

  <p-table
    [value]="companies()"
    [loading]="loading()"
    [tableStyle]="{ 'min-width': '30rem' }"
  >
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Zona horaria</th>
        <th>Estado</th>
        <th style="width: 10rem">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-company>
      <tr>
        <td>{{ company.name }}</td>
        <td>{{ company.timeZoneId }}</td>
        <td>
          <p-tag [value]="company.isActive ? 'Activo' : 'Inactivo'" [severity]="company.isActive ? 'success' : 'secondary'"></p-tag>
        </td>
        <td>
          @if (canWrite) {
            <div class="actions">
              <p-button icon="pi pi-pencil" ariaLabel="Editar empresa actual" [text]="true" (onClick)="openEditDialog(company)"></p-button>
            </div>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">Empresa actual no disponible.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-company-dialog
  [visible]="dialogVisible"
  [company]="editingCompany"
  (visibleChange)="onDialogVisibleChange($event)"
  (submitForm)="submitDialog($event)"
></app-company-dialog>
