pid /tmp/nginx.pid;
# Native nginx error events include raw request lines/queries. Use safe completion events instead.
error_log /dev/null crit;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    map $uri $api_authorization {
        default "";
        ~*^/api(/|$) $http_authorization;
    }
    default_type application/octet-stream;
    log_format safe escape=json '{"event":"edge_request_completed","method":"$request_method","status":$status,"elapsed_seconds":$request_time}';
    access_log /dev/stdout safe;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /tmp/default.conf;
}
